name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint Python and SQL
        run: make lint
      - name: Build data + star schema (fails on any data-quality check)
        run: make data etl
      - name: Tests
        run: pytest -q
